name: engine-ci

on:
  push:
    paths:
      - "packages/nexusagent/**"
      - ".github/workflows/engine-ci.yml"
  pull_request:
    paths:
      - "packages/nexusagent/**"
      - ".github/workflows/engine-ci.yml"

jobs:
  test:
    name: lint + typecheck + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install engine and dev tools
        run: pip install -e "packages/nexusagent[dev]"

      - name: Lint (ruff)
        run: ruff check packages/nexusagent

      - name: Type-check (mypy)
        working-directory: packages/nexusagent
        run: mypy src

      - name: Test (pytest)
        working-directory: packages/nexusagent
        run: pytest -q
